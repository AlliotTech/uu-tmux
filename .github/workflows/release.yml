name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（如 v0.1.0），仅重新打包发布用"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && TAG="${{ github.event.inputs.tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: 安装 xcodegen 与 iTerm2 并注册（AppleScript 编译需 iTerm2 术语）
        run: |
          brew install xcodegen
          brew install --cask iterm2
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f /Applications/iTerm.app
          osascript -e 'id of application "iTerm2"' || true

      - name: 构建单架构 UUTmux.app 并打包 DMG（ad-hoc 签名，非 Hardened Runtime）
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          cd native
          xcodegen generate
          build_arch() {
            arch="$1"
            derived="$(mktemp -d)"
            xcodebuild -project UUTmux.xcodeproj -scheme UUTmux \
              -configuration Release -destination 'generic/platform=macOS' \
              -derivedDataPath "$derived" \
              MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
              ARCHS="$arch" ONLY_ACTIVE_ARCH=NO \
              CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" \
              ENABLE_HARDENED_RUNTIME=NO \
              ENABLE_PREVIEWS=NO build
            app="$derived/Build/Products/Release/UUTmux.app"
            [ -d "$app" ] || { echo "未找到 $arch 构建产物 $app" >&2; exit 1; }
            stage="$(mktemp -d)"
            cp -R "$app" "$stage/UUTmux.app"
            ln -s /Applications "$stage/Applications"
            dmg="$GITHUB_WORKSPACE/UUTmux-${TAG}-${arch}.dmg"
            hdiutil create -volname "UUTmux" -srcfolder "$stage" -ov -format UDZO "$dmg" >/dev/null
            shasum -a 256 "$dmg"
          }
          build_arch arm64
          build_arch x86_64

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            UUTmux-${{ steps.version.outputs.tag }}-arm64.dmg
            UUTmux-${{ steps.version.outputs.tag }}-x86_64.dmg
